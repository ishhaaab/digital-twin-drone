name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r Tools/MAVLink/requirements.txt
      - name: Run MAVLink tests
        run: python -m unittest test_mavlink -v
        working-directory: Tools/MAVLink
      # Optional lint (best-effort, no fail on style)
      - name: Ruff lint (if available)
        run: pip install ruff && ruff check Tools/MAVLink/ || true

  unity-builder:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Unity build skipped
        if: ${{ env.UNITY_LICENSE == '' && (env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == '') }}
        run: echo "Unity build skipped — no license secret configured"
      - name: Build Unity project
        if: ${{ env.UNITY_LICENSE != '' || (env.UNITY_EMAIL != '' && env.UNITY_PASSWORD != '') }}
        uses: game-ci/unity-builder@v4
        with:
          projectPath: Unity
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: BuildScript.Build
